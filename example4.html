<!DOCTYPE html>
<html>
<head>
    <title>Forms in HTML</title>
</head>
<body>
    <h1>Course Registration Form</h1>
       <fieldset>
        <legend>Personal Details</legend>
         <form action = "" method ="post" autocomplte = "on">

        <label for ="sname">Surname</label>

        <label for = "mobilenumber">Mobile Number</label>
        <input type = "tel" id = "mobilenumber" placeholder="1234567890"> <br><br>
        <label for = "">Email</label>
        <input type = "email" placeholder="ramya@gmail.com"> <br><br>
        <label for = "">Password</label>
        <input type = "Password"> <br><br>
        <label for = "">Confirm Password</label>
        <input type = "pasword"> <br><br>
        <label for = "">Date Of Birth</label>
        <input type = "date"> <br><br>
        <label for = "">Age</label>
        <input type = "number"> <br><br>
        <label for = "">Gender</label>
        <input type = "radio" name = "Gender" value = "m"> <label for = "">Male</label>
        <input type = "radio" name = "Gender" value = "f"> <label for = "">Female</label>
        <input type = "radio" name = "Gender" value = "o"> <label for = "">Others</label>
        <br><br>
        <label for = "">Select Country</label>
        <select name = "" id = "">
            <option value = "">India</option>
            <option value = "">USA</option>
            <option value = "">UK</option>
            <option value = "">South Korea</option>
            <option value = "">Russia</option>
        </select> <br><br>
        <label for = "">Upload Picture</label>
        <input type = "file"> <br><br>
       </fieldset>
        <button type = "Reset">Reset</button> <br><br>
        <fieldset>
            <legend>Course Details</legend>
            <label for = "">Select Course</label>
        <select name = "" id = "">
            <option value = "">Java Full Stack</option>
            <option value = "">Data Analytics</option> 
        </select> <br><br>
        <label for = "">Delivery Mode</label> 
        <input type = "radio" name = "Delivery Course" value = "Online"> <label for = "">Online</label> 
        <input type = "radio" name = "Delivery Course" value = "Offline"> <label for = "">Offline</label> <br><br>
        <label for = "">Institute name</label>
        <input type = "text" name = "THOPSTECH" placeholder = "THOPSTECH"> <br><br>
        <label for = "">Comments</label>
        <textarea name = "" id = "" rows = "10" cols = "30"></textarea> <br><br>
        </fieldset>
        <button type = "button">Submit</button>
    </form>
    
</body>
</html>
